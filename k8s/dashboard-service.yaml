apiVersion: v1
kind: Service
metadata:
  name: web-dashboard
  namespace: routing-simulator
  labels:
    app.kubernetes.io/name: web-dashboard
spec:
  type: NodePort
  selector:
    app: web-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30573
      protocol: TCP
