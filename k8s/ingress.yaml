apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routing-simulator-ingress
  namespace: routing-simulator
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web-dashboard
                port:
                  number: 80
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mininet
                port:
                  number: 8080
